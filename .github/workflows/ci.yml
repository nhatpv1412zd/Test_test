name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn python-multipart numpy opencv-python-headless \
                      python-dotenv pytest httpx

      - name: Byte-compile sources
        run: python -m compileall -q src be scripts tests

      - name: Run tests
        run: pytest -q
