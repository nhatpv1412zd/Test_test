[pytest]
# Single routine-suite policy, also used by scripts/run_unit_api_tests.py.
testpaths =
    tests/test_api.py
    tests/test_upload_security.py
    tests/test_inference_admission.py
    tests/test_service.py
    tests/test_preprocessing.py
    tests/test_postprocessing.py
    tests/test_paths.py
addopts = -p no:cacheprovider --ignore=experiments --ignore=tests/test_inference_smoke.py
norecursedirs = experiments .venv node_modules .git
